name: build
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: report errors
        if: failure()
        run: |
          msg=$(grep -E "error:|\.java:[0-9]+|FAILURE|What went wrong|Could not" -A2 build.log | grep -v "^\s*at " | head -150 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: spindle-jar
          path: build/libs/*.jar
