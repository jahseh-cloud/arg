name: build
on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: build
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log
      - name: report errors
        if: failure()
        run: |
          msg=$(grep -E "error:|\.java:[0-9]+|FAILURE|What went wrong|Could not" -A2 build.log | grep -v "^\s*at " | head -150 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::error title=Build failed::${msg}"
      - name: automated behaviour tests
        run: ./ci/selftest.sh 2>&1 | tee selftest.log
      - name: report test results
        if: always()
        run: |
          [ -f selftest.log ] || exit 0
          msg=$(sed -n '/SELFTEST SUMMARY/,$p' selftest.log | head -80 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=Selftest::${msg}"
          grep "SELFTEST TRACE" selftest.log | sed 's/.*SELFTEST //' > traces.txt || true
          for name in $(grep "SELFTEST RESULT" selftest.log | grep " FAIL" | sed 's/.*RESULT \([a-z_]*\) .*/\1/'); do
            msg=$(grep "TRACE $name " traces.txt | cut -c1-330 | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
            echo "::notice title=Trace $name::${msg}"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-logs
          path: |
            selftest.log
            traces.txt
      - name: screenshots (dev branch only)
        if: success() && github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          ./ci/shots.sh || true
          if ls run/screenshots/*.png > /dev/null 2>&1; then
            gh release view screens > /dev/null 2>&1 || gh release create screens --prerelease --title "Test screenshots (not the mod)" --notes "Automated test screenshots. Not a mod release." --target dev
            gh release upload screens run/screenshots/*.png --clobber
          fi
          cp client.log run/client.log || true
          msg=$(grep -E "SHOTS |Exception|Caused by" client.log | grep -v "^\s*at " | head -40 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')
          echo "::notice title=Shots::${msg}"
      - name: read version
        if: success() && github.ref == 'refs/heads/main'
        id: ver
        run: echo "n=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: remove old unversioned release
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest-build --cleanup-tag -y || true
      - name: publish versioned release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.n }}
          name: Spindle v${{ steps.ver.outputs.n }}
          body: "Put spindle-v${{ steps.ver.outputs.n }}.jar in your mods folder with Fabric API (Minecraft 1.21.1). Remove any older spindle jar first."
          make_latest: true
          files: build/libs/spindle-v*.jar
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: spindle-jar
          path: build/libs/*.jar
